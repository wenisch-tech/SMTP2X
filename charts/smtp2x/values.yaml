image:
  repository: ghcr.io/wenisch-tech/smtp2x
  tag: "0.3.0"
  pullPolicy: IfNotPresent
replicaCount: 1
# The embedded H2 database and the persistent data volume have a single writer.
# Recreate prevents an updated pod from starting against the same data directory.
updateStrategy:
  type: Recreate
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
service:
  http:
    type: ClusterIP
    port: 8080
  smtp:
    type: ClusterIP
    port: 2525
metrics:
  path: /actuator/prometheus
  serviceAnnotations:
    enabled: true
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: smtp2x.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
persistence:
  enabled: true
  storageClassName: ""
  size: 10Gi
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
# Keep liveness disabled until the JVM, Flyway migration, and SMTP listener have
# finished starting. Set any probe's enabled flag to false to omit it.
startupProbe:
  enabled: true
  httpGet:
    path: /actuator/health
    port: http
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30
livenessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
readinessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 5
# Environment variables are passed directly to the SMTP2X container.
# Set externalSecretName to import every key from an existing Kubernetes Secret.
externalSecretName: ""
# To enable OIDC, configure these values (prefer secrets for the client secret):
# env:
#   SMTP2X_SECURITY_OIDC_ENABLED: "true"
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID: smtp2x
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_SCOPE: openid,profile,email
#   SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: https://auth.example.com/realms/smtp2x
# secrets:
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET: change-me
env:
  OIDC_IGNORE_TLS: "false"
secrets: {}
