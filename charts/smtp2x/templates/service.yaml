apiVersion: v1
kind: Service
metadata: { name: {{ include "smtp2x.fullname" . }}-http }
spec: { type: {{ .Values.service.http.type }}, selector: { app.kubernetes.io/name: {{ include "smtp2x.name" . }} }, ports: [{name: http, port: {{ .Values.service.http.port }}, targetPort: http}] }
---
apiVersion: v1
kind: Service
metadata: { name: {{ include "smtp2x.fullname" . }}-smtp }
spec: { type: {{ .Values.service.smtp.type }}, selector: { app.kubernetes.io/name: {{ include "smtp2x.name" . }} }, ports: [{name: smtp, port: {{ .Values.service.smtp.port }}, targetPort: smtp}] }
