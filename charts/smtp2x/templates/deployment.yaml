apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ include "smtp2x.fullname" . }} }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: {{ include "smtp2x.name" . }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: {{ include "smtp2x.name" . }} } }
    spec:
      containers:
        - name: smtp2x
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}, {name: smtp, containerPort: 2525}]
          env:
            {{- range $key, $value := .Values.env }}
            - { name: {{ $key }}, value: {{ $value | quote }} }
            {{- end }}
            {{- range $key, $value := .Values.secrets }}
            - name: {{ $key }}
              valueFrom: { secretKeyRef: { name: {{ include "smtp2x.fullname" $ }}, key: {{ $key }} } }
            {{- end }}
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, initialDelaySeconds: 20 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /app/data}]
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ include "smtp2x.fullname" . }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
