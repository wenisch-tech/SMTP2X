apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ include "smtp2x.fullname" . }} }
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector: { matchLabels: { app.kubernetes.io/name: {{ include "smtp2x.name" . }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: {{ include "smtp2x.name" . }} } }
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: smtp2x
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}, {name: smtp, containerPort: 2525}]
          env:
            {{- range $key, $value := .Values.env }}
            {{- if not (hasKey $.Values.secrets $key) }}
            - { name: {{ $key }}, value: {{ $value | quote }} }
            {{- end }}
            {{- end }}
            {{- range $key, $value := .Values.secrets }}
            - name: {{ $key }}
              valueFrom: { secretKeyRef: { name: {{ include "smtp2x.fullname" $ }}, key: {{ $key }} } }
            {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- toYaml (omit .Values.startupProbe "enabled") | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- toYaml (omit .Values.livenessProbe "enabled") | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- toYaml (omit .Values.readinessProbe "enabled") | nindent 12 }}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /app/data}]
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ include "smtp2x.fullname" . }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
