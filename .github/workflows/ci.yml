name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

# A release run must finish its tag before the next main run calculates a new
# version. PRs use separate groups and are still free to run in parallel.
concurrency:
  group: smtp2x-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versioning:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag_version.outputs.new_tag }}
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: image
        name: Normalize image name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: tag_version
        name: Calculate next version
        uses: mathieudutour/github-tag-action@v7.0.0
        with:
          github_token: ${{ github.token }}
          release_branches: main
          default_bump: patch
          # The actual tag is created in the release job, after every build,
          # image, chart, and OCI publication step has succeeded.
          dry_run: true
      - id: version
        name: Derive application version
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.tag_version.outputs.new_tag }}'
          if [ -z "$tag" ]; then tag='v0.1.0'; fi
          version="${tag#v}"
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            version="${version}-pr.${{ github.event.number }}.${{ github.run_number }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    needs: versioning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set Maven version
        run: mvn -B versions:set -DnewVersion=${{ needs.versioning.outputs.version }} -DgenerateBackupPoms=false
      - name: Verify
        run: mvn -B verify
      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Maven tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports

  chart:
    needs: versioning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Lint and render Helm chart
        run: |
          helm lint charts/smtp2x
          helm template smtp2x charts/smtp2x >/dev/null

  container:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [versioning, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set Maven version
        run: mvn -B versions:set -DnewVersion=${{ needs.versioning.outputs.version }} -DgenerateBackupPoms=false
      - name: Build application JAR
        run: mvn -B -DskipTests package
      - id: build_meta
        name: Generate build metadata
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build and publish container image
        uses: docker/build-push-action@v7
        with:
          # Path context is intentional: it includes target/smtp2x-*.jar built above.
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ needs.versioning.outputs.image }}:${{ needs.versioning.outputs.version }}
            ${{ needs.versioning.outputs.image }}:latest
          build-args: |
            BUILD_DATE=${{ steps.build_meta.outputs.date }}
            BUILD_VERSION=${{ needs.versioning.outputs.version }}
            BUILD_REVISION=${{ github.sha }}
      - name: Set up Trivy
        if: github.event_name == 'pull_request'
        uses: aquasecurity/setup-trivy@v0.2.6
      - name: Scan image with Trivy
        if: github.event_name == 'pull_request'
        run: |
          trivy image --format table --output trivy-report.txt \
            --scanners vuln --vuln-type os,library --severity CRITICAL,HIGH,MEDIUM \
            '${{ needs.versioning.outputs.image }}:${{ needs.versioning.outputs.version }}'
      - name: Upload Trivy report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report-${{ github.run_id }}
          path: trivy-report.txt
          if-no-files-found: warn
      - name: Add Trivy report to pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let report = fs.existsSync('trivy-report.txt') ? fs.readFileSync('trivy-report.txt', 'utf8') : 'Trivy did not produce a report.';
            if (report.length > 60000) report = `${report.slice(0, 60000)}\n… output truncated …`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: ['## Trivy vulnerability report', '', '```text', report, '```'].join('\n')
            });
      - name: Attest published image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: attest_build_provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.versioning.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Install Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign published image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ needs.versioning.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Prepare attestation release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BUNDLE_PATH: ${{ steps.attest_build_provenance.outputs.bundle-path }}
          ATTESTATION_URL: ${{ steps.attest_build_provenance.outputs.attestation-url }}
        run: |
          mkdir -p release
          cp "$BUNDLE_PATH" release/docker-image-attestation.bundle.json
          printf '%s\n' "$ATTESTATION_URL" > release/docker-image-attestation.url.txt
      - name: Upload attestation release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: docker-attestation-bundle
          path: |
            release/docker-image-attestation.bundle.json
            release/docker-image-attestation.url.txt

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [versioning, verify, chart, container]
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/_release.yml
    with:
      version: ${{ needs.versioning.outputs.version }}
      tag: ${{ needs.versioning.outputs.tag }}
      changelog: ${{ needs.versioning.outputs.changelog }}
      image: ${{ needs.versioning.outputs.image }}
      digest: ${{ needs.container.outputs.digest }}
    secrets: inherit
