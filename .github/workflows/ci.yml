name: CI
on:
  pull_request: { branches: ['**'] }
  push: { branches: ['**'] }
permissions: { contents: read, packages: write, attestations: write, id-token: write }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '25', cache: maven }
      - run: mvn -B verify
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: test-reports, path: 'target/surefire-reports' }
  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '25', cache: maven }
      - run: mvn -B -DskipTests package
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v7
        with:
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: 'ghcr.io/wenisch-tech/smtp2x:${{ github.sha }}'
          build-args: |-
            BUILD_VERSION=${{ github.sha }}
            BUILD_REVISION=${{ github.sha }}
      - uses: aquasecurity/setup-trivy@v0.2.6
      - run: trivy fs --scanners vuln --severity CRITICAL,HIGH,MEDIUM .
  chart:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: helm lint charts/smtp2x && helm template smtp2x charts/smtp2x >/dev/null
