<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Audit trail')}"></head>
  <body data-page="audit" th:attr="data-admin=${isAdmin}">
    <div class="shell">
      <aside th:replace="~{fragments/layout :: sidebar('audit')}"></aside>
      <main class="main">
        <header
          th:replace="~{fragments/layout :: header('WORKSPACE / ACTIVITY','Audit trail','Configuration changes and delivery events, in one place.')}"
        ></header>
        <div id="page-notice" class="notice" role="status" hidden></div>
        <section class="card">
          <div class="table-scroll">
            <table class="table">
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Actor</th>
                  <th>Event</th>
                  <th>Detail</th>
                </tr>
              </thead>
              <tbody id="history-rows"></tbody>
            </table>
          </div>
          <div id="history-empty" class="empty" hidden>
            No activity yet. Your workspace is ready when you are.
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
