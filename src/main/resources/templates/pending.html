<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Access pending')}"></head>
  <body>
    <main class="login card">
      <div class="brand">SMTP<i>2</i>X</div>
      <h1>Access pending</h1>
      <p class="muted">
        An SMTP2X administrator must grant you Viewer or Admin access.
      </p>
      <form method="post" action="/logout">
        <input
          type="hidden"
          th:name="${_csrf.parameterName}"
          th:value="${_csrf.token}"
        /><button class="btn ghost">Sign out</button>
      </form>
    </main>
  </body>
</html>
