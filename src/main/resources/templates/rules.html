<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>SMTP2X rules</title><link rel="stylesheet" href="/css/smtp2x.css"><meta name="_csrf" th:content="${_csrf.token}"><script defer src="/js/smtp2x.js"></script></head><body><div class="shell"><aside class="side"><div class="brand">SMTP<i>2</i>X</div><nav class="nav"><a href="/">Dashboard</a><a href="/messages">Messages</a><a href="/deliveries">Deliveries</a><a href="/actions">Actions</a><a class="active" href="/rules">Rules</a><a href="/audit">Audit trail</a><a href="/administration">Administration</a></nav></aside><main class="main"><h1>Routing rules</h1><div class="split"><section class="panel"><form class="form" id="rule"><label>Name<input class="input" name="name" required></label><label><input type="checkbox" name="globalRule"> Global rule</label><label>Recipient pattern<input class="input" name="recipientPattern" placeholder="alerts@example.com or *@example.com"></label><label>Envelope sender pattern<input class="input" name="senderPattern"></label><label>Subject contains<input class="input" name="subjectFilter"></label><label>Action IDs, one per line<textarea class="input" name="actions" required></textarea></label><button class="btn">Save rule</button></form></section><section class="panel"><table class="table"><thead><tr><th>Name</th><th>Scope</th><th>Actions</th></tr></thead><tbody id="rules"></tbody></table></section></div></main></div><script>document.addEventListener('DOMContentLoaded',()=>{const f=rule,refresh=()=>smtp2x.rows('/rules','#rules',[x=>x.name,x=>x.globalRule?'Global':x.recipientPattern,x=>x.actionIds.join(', ')]);refresh();f.onsubmit=async e=>{e.preventDefault();try{await smtp2x.api('/rules',{method:'POST',body:JSON.stringify({name:f.name.value,globalRule:f.globalRule.checked,enabled:true,recipientPattern:f.recipientPattern.value,senderPattern:f.senderPattern.value,subjectFilter:f.subjectFilter.value,subjectMode:'CONTAINS',actionIds:f.actions.value.split('\n').filter(Boolean)})});f.reset();refresh()}catch(e){alert(e.message)}}})</script></body></html>
