<!doctype html><html><head><title>SMTP2X actions</title><link rel="stylesheet" href="/css/smtp2x.css"><meta name="_csrf" th:content="${_csrf.token}" xmlns:th="http://www.thymeleaf.org"><script defer src="/js/smtp2x.js"></script></head><body><div class="shell"><aside class="side"><div class="brand">SMTP<i>2</i>X</div><nav class="nav"><a href="/">Dashboard</a><a href="/messages">Messages</a><a href="/deliveries">Deliveries</a><a class="active" href="/actions">Actions</a><a href="/rules">Rules</a><a href="/audit">Audit trail</a><a href="/administration">Administration</a></nav></aside><main class="main"><div class="top"><div><span class="label">Configuration</span><h1>Actions</h1><p class="muted">GitLab actions can resolve SMTP recipients and default email addresses into issue assignees.</p></div></div><div class="split"><section class="panel"><h2>Create action</h2><form id="action-form" class="form"><label>Name<input class="input" name="name" required></label><label>Type<select class="input" name="type" id="action-type"><option value="GITLAB_ISSUE">GitLab issue</option><option value="WEBHOOK">Webhook</option></select></label><div id="gitlab"><label>GitLab base URL<input class="input" name="baseUrl" value="https://gitlab.com"></label><label>Project ID or path<input class="input" name="project" placeholder="group/project" required></label><label>Access token<input class="input" name="accessToken" type="password" required></label><label><input type="checkbox" name="useRecipient"> Use recipient as assignee</label><label>Default assignee emails (one per line)<textarea class="input" name="defaults"></textarea></label><label>Email mappings as JSON <textarea class="input" name="mappings" placeholder='{"alias@example.com": 42}'>{}</textarea></label><button type="button" class="btn ghost" id="preview">Validate assignees</button><div id="preview-result" class="muted"></div></div><div id="webhook" hidden><label>Webhook URL<input class="input" name="url"></label><label>Bearer token<input class="input" type="password" name="bearerToken"></label></div><button class="btn">Save action</button></form></section><section class="panel"><h2>Configured actions</h2><table class="table"><thead><tr><th>Name</th><th>Type</th><th>State</th></tr></thead><tbody id="actions"></tbody></table></section></div></main></div><script>document.addEventListener('DOMContentLoaded',()=>{const form=document.querySelector('#action-form'),type=document.querySelector('#action-type');const refresh=()=>smtp2x.rows('/actions','#actions',[x=>x.name,x=>x.type,x=>x.enabled?'Enabled':'Disabled']);refresh();type.onchange=()=>{gitlab.hidden=type.value!=='GITLAB_ISSUE';webhook.hidden=!gitlab.hidden};const config=()=>type.value==='GITLAB_ISSUE'?{baseUrl:form.baseUrl.value,project:form.project.value,accessToken:form.accessToken.value,useRecipient:form.useRecipient.checked,defaultAssigneeEmails:form.defaults.value.split('\n').filter(Boolean),assigneeEmailMappings:JSON.parse(form.mappings.value||'{}')}:{url:form.url.value,bearerToken:form.bearerToken.value};form.onsubmit=async e=>{e.preventDefault();try{await smtp2x.api('/actions',{method:'POST',body:JSON.stringify({name:form.name.value,type:type.value,enabled:true,configuration:config()})});form.reset();refresh()}catch(e){alert(e.message)}};preview.onclick=async()=>{try{let v=await smtp2x.api('/actions/gitlab/assignees/preview',{method:'POST',body:JSON.stringify({configuration:config(),recipients:[]})});document.querySelector('#preview-result').textContent=v.resolutions.map(x=>x.email+': '+x.status+(x.gitlabUserId?' (#'+x.gitlabUserId+')':'')).join(' · ')||'No assignees configured'}catch(e){alert(e.message)}}})</script></body></html>
