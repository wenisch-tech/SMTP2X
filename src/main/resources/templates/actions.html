<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Actions')}"></head>
  <body data-page="actions" th:attr="data-admin=${isAdmin}">
    <div class="shell">
      <aside th:replace="~{fragments/layout :: sidebar('actions')}"></aside>
      <main class="main">
        <header
          th:replace="~{fragments/layout :: header('WORKSPACE / CONFIGURATION','Actions','Reusable destinations for the messages that matter.')}"
        ></header>
        <div id="page-notice" class="notice" role="status" hidden></div>
        <div class="section-heading toolbar">
          <p class="muted">Connect once. Use across your routing rules.</p>
          <button id="new-action" class="btn" th:if="${isAdmin}">
            + Create action
          </button>
        </div>
        <div id="action-list" class="action-grid"></div>
        <div th:replace="~{fragments/action-dialog :: dialog}"></div>
      </main>
    </div>
  </body>
</html>
