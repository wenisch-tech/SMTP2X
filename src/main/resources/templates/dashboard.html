<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>SMTP2X</title><link rel="stylesheet" href="/css/smtp2x.css"><meta name="_csrf" th:content="${_csrf.token}"><script defer src="/js/smtp2x.js"></script></head><body><div class="shell"><aside class="side"><div class="brand">SMTP<i>2</i>X</div><p>SMTP notification gateway</p><nav class="nav"><a class="active" href="/">Dashboard</a><a href="/messages">Messages</a><a href="/deliveries">Deliveries</a><a href="/actions">Actions</a><a href="/rules">Rules</a><a href="/audit">Audit trail</a><a href="/administration">Administration</a></nav></aside><main class="main"><div class="top"><div><span class="label">Overview</span><h1>Delivery control room</h1></div><div class="muted" th:text="${user}"></div></div><section class="grid"><div class="panel"><div class="label">Messages</div><div class="metric" th:text="${messages}"></div></div><div class="panel"><div class="label">Deliveries</div><div class="metric" th:text="${deliveries}"></div></div><div class="panel"><div class="label">Actions</div><div class="metric" th:text="${actions}"></div></div><div class="panel"><div class="label">Rules</div><div class="metric" th:text="${rules}"></div></div></section><section class="panel" style="margin-top:1rem"><h2>Recent messages</h2><table class="table"><thead><tr><th>Received</th><th>From</th><th>Subject</th></tr></thead><tbody><tr th:each="m:${recent}"><td th:text="${m.receivedAt}"></td><td th:text="${m.envelopeFrom}"></td><td th:text="${m.subject}"></td></tr></tbody></table></section></main></div></body></html>
