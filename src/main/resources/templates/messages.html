<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Messages')}"></head>
  <body data-page="messages" th:attr="data-admin=${isAdmin}">
    <div class="shell">
      <aside th:replace="~{fragments/layout :: sidebar('messages')}"></aside>
      <main class="main">
        <header
          th:replace="~{fragments/layout :: header('WORKSPACE / ACTIVITY','Messages','A durable record of your incoming notifications.')}"
        ></header>
        <div id="page-notice" class="notice" role="status" hidden></div>
        <section class="card">
          <div class="table-scroll">
            <table class="table">
              <thead>
                <tr>
                  <th>Received</th>
                  <th>From / recipients</th>
                  <th>Subject</th>
                </tr>
              </thead>
              <tbody id="history-rows"></tbody>
            </table>
          </div>
          <div id="history-empty" class="empty" hidden>
            No activity yet. Your workspace is ready when you are.
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
