<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>SMTP2X sign in</title><link rel="stylesheet" href="/css/smtp2x.css"></head><body><main class="login panel"><div class="brand">SMTP<i>2</i>X</div><p class="muted">Turn SMTP notifications into work.</p><form class="form" method="post" action="/login"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Email<input class="input" name="username" type="email" required autofocus></label><label>Password<input class="input" name="password" type="password" required></label><p th:if="${param.error}" class="notice">The email or password was not accepted.</p><p th:if="${param.logout}" class="notice">You have signed out.</p><button class="btn">Sign in</button></form><p class="muted">When OIDC is enabled, <a href="/oauth2/authorization/keycloak">sign in with Keycloak</a>.</p></main></body></html>
